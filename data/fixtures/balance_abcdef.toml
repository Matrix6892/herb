# Control set for the `balance` preset, spec §5.5.
#
# Inputs: unit price in dollars per 100 mg and the rating already adjusted
# (R_b). Expected scores are checked with the tolerance below, in the core
# tests and on the /how page (test `how_page_matches_code`).
#
# The ids are numeric because the tie-break falls back to iherb_id; `name` is
# the letter used in the spec.

tolerance = 0.05
expected_order = ["B", "C", "E", "D", "A", "F"]

