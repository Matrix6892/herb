# Forms of substances as they appear on labels (spec §4.2).
#
# `elemental_ratio` is the mass of the element per mass of the compound. It is
# written out as `n × A(Mg) / M(compound)` in mg/mol and must equal the ratio
# derived from `formula` with IUPAC CIAAW 2021 conventional atomic weights
# (https://www.ciaaw.org/atomic-weights.htm); `catalog-core` refuses the file
# otherwise. The formula names the hydration state: a label that declares a
# salt mass without saying which hydrate cannot be converted and must be
# entered with `confidence = "unknown"` (docs/open-questions.md, Q-REF-2).
#
# `source_url` points to the compound record for the formula. The URLs and
# formulas were written from standard chemistry and have not been opened from
# the build environment; the second reviewer checks each against the source.
#
# `bioavailability_k` stays unset: phase 1 uses k_form = 1 (spec §5.2), and no
# coefficient is entered without a source.
#
# review: pending second reviewer (docs/open-questions.md, Q-REF-1)

schema = 1

