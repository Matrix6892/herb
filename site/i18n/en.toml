[how]
title = "How we rank"
lede = "Every number on this site comes from two places: the affiliate network's daily product feed (prices, availability) and labels we read by hand from product photos. We never copy data from store pages."
dose_heading = "1. The dose on the label"
dose_text = "Labels state either the mass of the compound (“magnesium citrate 500 mg”) or the mass of the element (“magnesium (as citrate) 200 mg”). For a compound we multiply by the element's share of its mass, derived from the chemical formula and standard atomic weights. Lines of the same substance are added exactly and rounded down to a microgram once."
dose_example = "Example: {printed} of {form} × {ratio} ({percent}) = {result} of {substance}, rounded down to a microgram."
unit_heading = "2. Price per unit"
unit_formula = "P_unit = price ÷ (servings per container × dose per serving × k_form)"
unit_text = "We express it per {unit} of {substance}. k_form is 1 for every form: we do not adjust for absorption. A product without a price, without a verified label, or with a price shown only in the cart gets no price per unit and takes part in no ranking; its page says why."
unit_example = "Example: {price} ÷ ({servings} × {dose}) × {unit} = {unit_price}."
rating_heading = "3. Rating adjusted for the number of reviews"
rating_formula = "R_b = (n × R + C × m) ÷ (n + C)"
rating_text = "R is a product's average rating and n its number of reviews; m is the plain average rating in the category and C the median number of reviews there. A few perfect reviews count for less than many good ones."
balance_heading = "4. Balance"
balance_formula = "q_price = 100 × (ln P_max − ln P_unit) ÷ (ln P_max − ln P_min); q_rating = 100 × (R_b − R_min) ÷ (R_max − R_min); S = min(q_price, q_rating)"
balance_text = "Both scores run from 0 to 100 within the category. The logarithm makes equal price ratios count equally: $0.06 against $0.08 matters as much as $0.15 against $0.20. A product is only as good as its weaker score. Ties are broken by the sum of both scores, then by the lower price per unit."
balance_control = "Control set. The same numbers are checked by the code before every publication:"
balance_rank_note = "An earlier draft of this method compared positions in each list rather than values, and C came first. Comparing values puts B first: its weaker score, rating at 66.7, is slightly higher than C's weaker score, price at 66.3."
col_product = "Product"
col_p_unit = "P_unit, $ per 100 mg"
col_r_b = "R_b"
col_q_price = "q_price"
col_q_rating = "q_rating"
col_s = "S"
order = "Order: {order}."
presets_heading = "Rankings on this site"
no_rating_text = "Ratings are not shown: until the store confirms that we may display them, we rank by price only. The third-party tested ranking uses the testing marks printed on labels."
sources_heading = "Data and updates"
sources_text = "Prices and availability come from the affiliate network's product feed and are refreshed every day at 06:00 UTC. If the feed fails, the site keeps the previous day and says so by its date. Labels are entered by hand from photos and checked; each product page names who checked it and when. Conversion factors come from our reference with a source for each."
money_heading = "How we make money"
money_text = "When you buy through a “Buy on iHerb” button, the store pays us a commission. The commission rate is not part of any formula here, so it cannot change the order."
no_advice = "We show doses and prices. We do not recommend a dose or a product for your health."

[disclosure]
title = "Affiliate disclosure"
body = "This site is a participant in the iHerb affiliate program through its affiliate network. When you follow a “Buy on iHerb” link and buy something, we may earn a commission at no extra cost to you. Every such link is marked and sends you directly to the store through the network's tracking link. The commission never enters the ranking formulas, which are published on the methodology page."

[privacy]
title = "Privacy"
body_1 = "No accounts, no advertising trackers and no cookies."
body_2 = "When you press a “Buy on iHerb” button, your browser sends us the product, the ranking you were looking at, the page and the time. To tell repeated clicks apart within a day we store a one-way hash of your browser's user agent and the date. We do not store your IP address."
body_3 = "When you report an error, we store what you write, the page and the time. Please do not include personal details."
body_4 = "The companies that host the site and the store you buy from process requests under their own policies."

[notfound]
