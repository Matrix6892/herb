# Interface strings for en-US (spec §7.4). Templates refer to keys only;
# `{name}` marks a value filled in by the generator. Product names and label
# text are never translated: they come from the label.
#
# A key used by a template but missing here fails the build.

[locale]
code = "en-US"
lang = "en"
dir = "ltr"
decimal = "."
group = ","
currency_symbol = "$"
currency_position = "prefix"

